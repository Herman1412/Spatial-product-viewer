apply plugin: 'com.android.library'

android {
    namespace 'com.spatialproductviewer.importing'
    compileSdk 34
    defaultConfig {
        minSdk 32
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }
}
